name: Release (Windows and Linux)

# Push v* tags or release/v* branches, or dispatch a source ref and matching tag.
# Publish only after both operating systems have built and passed their checks.
on:
  push:
    tags: ['v*']
    branches: ['release/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish, for example v0.1.5. Created if absent.'
        required: true
      source_ref:
        description: 'Branch, tag or commit to build and tag'
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            flag: win
          - os: ubuntu-22.04
            platform: linux
            flag: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Work out the release version
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "RELEASE_TAG=${INPUT_TAG:-${REF_NAME#release/}}" >> "$GITHUB_ENV"
      - name: Check release version
        run: node -e "const v = require('./package.json').version; if (process.env.RELEASE_TAG !== 'v' + v) throw new Error('Tag and package version must match');"
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: node --test electron/security.test.cjs
      - name: Fetch piano samples
        run: npm run samples
      - run: npm run build
      - run: npm run check:bundle
      - name: Package desktop app
        run: npx electron-builder --${{ matrix.flag }} --publish never
      - name: Check packaged Linux app
        if: matrix.platform == 'linux'
        run: xvfb-run -a node scripts/smoke-desktop.mjs release/linux-unpacked/keysense
      - name: Save packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
      - name: Record exact build commit
        shell: bash
        run: git rev-parse HEAD > build-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: commit-${{ matrix.platform }}
          path: build-commit.txt

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: commit-*
          path: commits
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${REF_NAME#release/}}"
          COMMIT="$(tr -d '\r\n' < commits/commit-windows/build-commit.txt)"
          LINUX_COMMIT="$(tr -d '\r\n' < commits/commit-linux/build-commit.txt)"
          test "$COMMIT" = "$LINUX_COMMIT"
          # Fail before touching a release if any required package is missing.
          test "$(find release -name '*.exe' | wc -l)" -eq 2
          test "$(find release -name '*.AppImage' | wc -l)" -eq 1
          test "$(find release -name '*.deb' | wc -l)" -eq 1
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            NOTES="docs/releases/${TAG#v}.md"
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --target "$COMMIT" --title "Keysense ${TAG#v}" --notes-file "$NOTES" --draft
            else
              gh release create "$TAG" --target "$COMMIT" --title "Keysense ${TAG#v}" --generate-notes --draft
            fi
          fi
          gh release upload "$TAG" release/*.exe release/*.AppImage release/*.deb --clobber
          gh release edit "$TAG" --draft=false
