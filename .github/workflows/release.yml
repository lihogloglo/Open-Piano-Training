name: Release (Windows)

# Builds the portable Windows .exe and attaches it to a GitHub release, so the
# app can be downloaded on any machine. Push a version tag to start it:
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# You can also start it by hand from the Actions tab. A hand-started run needs
# the tag to exist already.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, for example v0.1.1'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node -e "const v = require('./package.json').version; if (process.env.RELEASE_TAG !== 'v' + v) throw new Error('Tag and package version must match');"

      - run: npm run check
      - run: npm run format:check
      - run: node --test electron/security.test.cjs

      # Pulls the piano samples into public/samples, so the installed app needs
      # no network.
      - name: Fetch piano samples
        run: npm run samples

      - run: npm run build
      - run: npm run check:bundle

      # Only the portable target. The NSIS installer would double the build time.
      - name: Package portable .exe
        run: npx electron-builder --win portable --publish never

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Keysense ${TAG#v}" --generate-notes
          gh release upload "$TAG" release/*-portable.exe --clobber
