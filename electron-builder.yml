appId: dev.openpianotraining.app
productName: Open Piano Training
copyright: Open Piano Training

directories:
  output: release
  buildResources: build

# Piano sounds are downloaded by the user at runtime. Never package local samples.
files:
  - electron/**/*
  - dist/**/*
  - '!dist/samples/**/*'
  - package.json
  - LICENSE

asar: true

win:
  icon: public/pwa-512.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Open Piano Training

portable:
  artifactName: Open-Piano-Training-${version}-portable.exe

linux:
  executableName: open-piano-training
  icon: public/pwa-512.png
  category: Education
  executableArgs: []
  synopsis: Learn piano with guided lessons and MIDI feedback
  maintainer: Open Piano Training
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: Open-Piano-Training-${version}-linux-${arch}.${ext}
